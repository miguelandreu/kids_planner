name: Planes con niños

on:
  schedule:
    # Jueves a las 12:10 UTC (14:17 en Madrid en verano, 13:17 en invierno).
    - cron: "17 12 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Imprimir el email en vez de enviarlo"
        type: boolean
        default: true

concurrency:
  group: weekly-plans
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: KidsPlanner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version

      - name: Instalar dependencias
        run: uv sync --frozen --no-dev

      - name: Generar y enviar planes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.GOOGLE_EMAIL }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: uv run kids-planner
