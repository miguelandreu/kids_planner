[project]
name = "kids-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "numpy>=2.5.4",
    "openai-agents>=0.24.0",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.6",
    "retry-requests>=2.0.0",
]

[project.scripts]
kids-planner = "kids_planner.kids_planner:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: llamadas reales a servicios externos (Open-Meteo)"]
